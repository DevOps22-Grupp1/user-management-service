name: Docker Build and Push

on:
  push:
    branches: ["*"]
  pull_request:
    branches:
      - main

permissions:
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Använder senaste versionen

      - name: Docker Login
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin

      # --- Test-hanteringen är nu utkommenterad/inaktiverad ---
      # - name: Build Docker Image to Test repositories
      #   run: |
      #     docker build -t passwordnotsafe/test-cypress:user-management-service ./backend

      # - name: Push Docker Image to Test repositories
      #   run: |
      #     docker push passwordnotsafe/test-cypress:user-management-service
      # ----------------------------------------------------

      # --- Huvud-servicen är nu aktiverad ---
      - name: Build Docker Image (user-management-service)
        run: |
          # Bygger och taggar med 'latest'
          docker build -t passwordnotsafe/user-management-service:latest ./backend
          # Bygger och taggar med den unika commit SHA
          docker build -t passwordnotsafe/user-management-service:${{ github.sha }} ./backend

      - name: Push Docker Image (user-management-service)
        run: |
          # Pushar 'latest' taggen
          docker push passwordnotsafe/user-management-service:latest
          # Pushar SHA taggen
          docker push passwordnotsafe/user-management-service:${{ github.sha }}
      # ------------------------------------
